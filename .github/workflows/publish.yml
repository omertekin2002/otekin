name: Main checks and npm publish

on:
  push:
    branches:
      - main

env:
  # npm publishing is paused by the owner's decision in
  # https://github.com/omertekin2002/otekin/issues/50 and `npx otekin` stays on 0.1.21.
  # To resume publishing, change this one value to "true". Nothing else needs editing:
  # the release job below keeps its own write permissions and runs only when this is "true".
  NPM_PUBLISH_ENABLED: "false"

permissions:
  contents: read

jobs:
  # Test.yml skips pushes to main, so these are the only checks that run on main.
  checks:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    outputs:
      publish-enabled: ${{ env.NPM_PUBLISH_ENABLED }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm pack --dry-run

  # Bumps the patch version, publishes to npm and pushes the release commit and tag.
  # Skipped while NPM_PUBLISH_ENABLED is not "true", so it never gets a write token then.
  release:
    needs: checks
    if: needs.checks.outputs.publish-enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - run: |
          npm version patch -m "chore(release): %s [skip ci]"

      - run: npm publish

      - run: git push --follow-tags
